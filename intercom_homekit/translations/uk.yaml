configuration:
  doorbells:
    name: Дверні дзвінки
    description: >-
      Один запис на кожну викличну панель. Кожна стає окремим аксесуаром HomeKit (додайте кожну; коди
      є на сторінці «Відкрити веб-інтерфейс») і окремим пристроєм Home Assistant. Назви мають бути різними.
    fields:
      name:
        name: Назва
        description: Назва в програмі «Дім» і в Home Assistant. Після перейменування підключення до HomeKit зберігається, якщо IP-адреса та сама.
      type:
        name: Тип панелі
        description: Виробник викличної панелі. Типово hikvision.
      host:
        name: IP-адреса
        description: IP-адреса викличної панелі, наприклад 192.168.88.21.
      username:
        name: Користувач
        description: Користувач викличної панелі (зазвичай admin).
      password:
        name: Пароль
        description: Пароль викличної панелі.
      doors:
        name: Реле дверей
        description: Скільки замків показувати (0 — не показувати). Типово 1.
      door_relock_seconds:
        name: Затримка закриття
        description: Через скільки секунд плитка замка в HomeKit знову показує «Зачинено». Типово 5.
      homekit_pin:
        name: Код HomeKit
        description: Постійний код налаштування (у форматі 123-45-678). Якщо не вказано, створюється випадковий.
      rtsp_url:
        name: Інша адреса RTSP
        description: >-
          Інше джерело відео, наприклад ретрансляція go2rtc або Frigate, щоб не займати сеанси панелі.
          Типово — основний потік панелі.
      http_port:
        name: Порт HTTP
        description: Типово 80.
      rtsp_port:
        name: Порт RTSP
        description: Типово 554.
      sdk_port:
        name: Порт SDK
        description: Для голосового зв’язку. Типово 8000.
      reset_homekit_pairing:
        name: Скинути підключення до HomeKit
        description: Забути підключення цього дзвінка й створити новий аксесуар HomeKit під час наступного запуску. Потім вимкніть знову.
  talkback:
    name: Голосовий зв’язок
    description: Ваш голос із програми «Дім» у динамік викличної панелі.
    fields:
      ring_action:
        name: Якщо триває виклик
        description: >-
          Поки панель дзвонить, вона не відтворює ваш голос. hangUp тихо завершує виклик (рекомендовано),
          reject завершує його сигналом «зайнято», answer_hangup відповідає й одразу завершує (потрібен Hik-Connect),
          none нічого не робить.
      gain:
        name: Гучність
        description: >-
          Гучність вашого голосу біля дверей, понад автоматичне вирівнювання рівня (1.0 — приблизно -16 dBFS,
          2.0 — на 6 dB гучніше). Піки обмежуються, тож більше значення стискає звук, а не спотворює.
      idle_seconds:
        name: Звільнити після тиші
        description: Через скільки секунд тиші динамік панелі звільняється. Типово 3.
  video:
    name: Відео
    fields:
      transcode:
        name: Перекодування
        description: Завжди перекодовувати через libx264 (навантажує процесор). Для потоків H.265 не потрібно, їх перекодовано автоматично.
      max_streams:
        name: Трансляцій на дзвінок
        description: Скільки трансляцій HomeKit можна дивитися одночасно. Типово 2.
  homekit:
    name: HomeKit
    fields:
      port:
        name: Перший порт
        description: TCP-порт HomeKit першого дзвінка; наступні дзвінки використовують наступні порти. Типово 51828.
      bind:
        name: Мережевий інтерфейс
        description: Назва інтерфейсу або IP-адреса для оголошення HomeKit (типово всі). Вкажіть, якщо підключення працює нестабільно на хості з кількома мережами.
      mdns_advertiser:
        name: Оголошення mDNS
        description: Бібліотека, що оголошує аксесуар у мережі. Спробуйте bonjour-hap, якщо дзвінок не знаходиться під час підключення.
  mqtt:
    name: Сутності Home Assistant (MQTT)
    description: >-
      Публікувати кожну панель у Home Assistant як пристрій із датчиками й керуванням. Автоматично
      використовує брокер Mosquitto; заповнюйте лише для іншого брокера.
    fields:
      enabled:
        name: Увімкнено
      host:
        name: Адреса брокера
      port:
        name: Порт брокера
      username:
        name: Користувач
      password:
        name: Пароль
  system:
    name: Система
    fields:
      log_level:
        name: Рівень журналу
      call_poll_interval:
        name: Інтервал перевірки дзвінка
        description: Скільки секунд між перевірками стану виклику (затримка виявлення дзвінка). Типово 1.
      language:
        name: Мова
        description: >-
          Назви сутностей Home Assistant і плиток дверей у HomeKit: en (англійська, типово) або uk
          (українська). Ідентифікатори сутностей лишаються англійськими. Сторінка підключення відкривається мовою браузера.
