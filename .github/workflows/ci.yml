name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Docker Hub namespace: repository variable DOCKERHUB_USERNAME (Settings → Secrets and variables →
  # Actions → Variables). Without it (forks), images are only built and tested, never pushed.
  IMAGE: ${{ vars.DOCKERHUB_USERNAME || 'local' }}/intercom-homekit

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The add-on image's base: the same Node.js and ffmpeg the add-on runs with, from Debian's
    # mirrors (the runner's Ubuntu mirror once took 20 minutes and then failed).
    container: node:26-bookworm-slim
    defaults:
      run:
        working-directory: intercom_homekit
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (SRTP interop tests)
        run: apt-get update && apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  addon-lint:
    name: Add-on configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./intercom_homekit

  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Publish and release this version?
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          version=$(grep -m1 '^version:' intercom_homekit/config.yaml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version bump touches config.yaml, package.json and the changelog: catch a forgotten one on every push.
          npm_version=$(node -p "require('./intercom_homekit/package.json').version")
          if [ "$npm_version" != "$version" ]; then
            echo "::error file=intercom_homekit/package.json::version $npm_version, but config.yaml says $version (bump with npm version, see CONTRIBUTING.md)"; exit 1
          fi
          if ! grep -qx "## $version" intercom_homekit/CHANGELOG.md; then
            echo "::error file=intercom_homekit/CHANGELOG.md::no \"## $version\" section (release with npm version, see CONTRIBUTING.md)"; exit 1
          fi
          # Only from main and only with a Docker Hub namespace (forks build and test only).
          on_main=false
          if [ -n "$DOCKERHUB_USERNAME" ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            on_main=true
          fi
          # Never overwrite a published image.
          if $on_main && ! docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "will publish $IMAGE:$version"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "not publishing $IMAGE:$version"
          fi
          # Release each version once (a re-run after a failed release still creates it).
          if $on_main && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "will release v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "not releasing v$version"
          fi

  image:
    name: Image (${{ matrix.arch }})
    needs: [test, addon-lint, meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.meta.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Bundled SDK matches SHA256SUMS
        working-directory: intercom_homekit/vendor/hcnetsdk
        run: sha256sum -c --quiet SHA256SUMS
      - name: Build
        run: >-
          docker build
          --build-arg BUILD_ARCH=${{ matrix.arch }}
          --build-arg BUILD_VERSION=${{ needs.meta.outputs.version }}
          -t "$IMAGE:$TAG" intercom_homekit
      - name: SDK loads and initialises in the image
        run: |
          docker run --rm "$IMAGE:$TAG" node --input-type=module -e "
            import koffi from 'koffi';
            const lib = koffi.load('/opt/hcnetsdk/libhcnetsdk.so');
            const init = lib.func('int NET_DVR_Init()');
            const version = lib.func('uint32_t NET_DVR_GetSDKBuildVersion()');
            if (!init()) throw new Error('NET_DVR_Init failed');
            const v = version();
            console.log('HCNetSDK', [v >>> 24, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff].join('.'), process.arch);
            lib.func('int NET_DVR_Cleanup()')();
          "
      - name: ffmpeg and ffprobe are there
        run: |
          docker run --rm "$IMAGE:$TAG" ffmpeg -hide_banner -version
          docker run --rm "$IMAGE:$TAG" ffprobe -hide_banner -version
      - name: Log in to Docker Hub
        if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push ${{ matrix.arch }} image
        if: needs.meta.outputs.publish == 'true'
        run: docker push "$IMAGE:$TAG"

  publish:
    name: Publish multi-arch image
    needs: [meta, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Combine amd64 + arm64 under the version tag and latest
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-aarch64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    name: GitHub release
    needs: [meta, image, publish]
    # Once the image is on Docker Hub: published by this run, or by an earlier one whose release failed.
    if: >-
      always() && needs.meta.outputs.release == 'true' && needs.image.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          {
            awk -v h="## $VERSION" '$0 == h { found = 1; next } found && /^## / { exit } found' intercom_homekit/CHANGELOG.md
            echo
            echo "---"
            echo "Update from the add-on page in Home Assistant. Image: \`$IMAGE:$VERSION\` (amd64, aarch64)."
          } > notes.md
          cat notes.md
      - name: Create v${{ needs.meta.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --latest
